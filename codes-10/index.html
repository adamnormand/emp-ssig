<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codes 10 — SSI Gaspé</title>
<meta name="description" content="Référence rapide des codes radio 10 — Service de sécurité incendie de la Ville de Gaspé.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1832">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1832; --shield:#1E3568; --red:#CE2338;
    --btn:#F4F5F7; --btn-ink:#0E1832; --muted:#8FA0C4; --line:rgba(255,255,255,.18);
    --c-o:#E8890C; --c-g:#2F9E44; --c-b:#5B7DA8; --c-r:#CE2338;
    --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:#fff;font-family:var(--body);line-height:1.35;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;
    padding:0 calc(18px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}

  /* ---------- En-tête collant ---------- */
  .top{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top)) 0 10px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .back{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);text-decoration:none}
  .back:hover,.back:focus-visible{color:#fff}
  h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
  .maj{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .chevron{height:7px;margin:10px 0 12px;
    background:repeating-linear-gradient(115deg,var(--red) 0 12px,#fff 12px 24px)}
  .search{width:100%;min-height:46px;padding:10px 14px;font:500 17px var(--body);
    background:var(--shield);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:0;outline:none;
    -webkit-appearance:none;appearance:none}
  .search::placeholder{color:var(--muted)}
  .search:focus{border-color:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;
    background:transparent;color:#fff;border:1px solid var(--line);cursor:pointer;
    font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
  .chip i{width:9px;height:9px;display:inline-block}
  .chip[aria-pressed="true"]{background:#fff;color:var(--btn-ink);border-color:#fff}
  .chip:focus-visible{outline:3px solid #fff;outline-offset:2px}

  /* ---------- Liste ---------- */
  ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  li{display:flex;align-items:stretch;background:var(--btn);color:var(--btn-ink);min-height:50px;border-left:5px solid}
  .code{flex:none;width:88px;display:flex;align-items:center;padding-left:10px;
    font-family:var(--mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
  .code.long{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
  .txt{flex:1;padding:9px 12px 9px 0;display:flex;align-items:center;font-size:15px;line-height:1.3}
  li.o{border-color:var(--c-o)} li.o .code{color:#B5650A}
  li.g{border-color:var(--c-g)} li.g .code{color:#23803A}
  li.b{border-color:var(--c-b)} li.b .code{color:#46658F}
  li.r{border-color:var(--c-r);background:#FCE9EC} li.r .code{color:var(--c-r)} li.r .txt{font-weight:600}
  .empty{display:none;text-align:center;color:var(--muted);padding:28px 0;font-family:var(--display);
    letter-spacing:.16em;text-transform:uppercase;font-size:13px}

  footer{margin-top:18px;text-align:center}
  footer p{margin:0;font-family:var(--mono);font-size:11px;color:var(--muted);opacity:.65}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="bar">
      <h1>Codes 10</h1>
      <a class="back" href="../">‹ Accueil</a>
    </div>
    <div class="maj">Mise à jour : juillet 2026</div>
    <div class="chevron" aria-hidden="true"></div>
    <input class="search" id="q" type="search" inputmode="search" autocomplete="off"
           placeholder="Code ou mot-clé…" aria-label="Rechercher un code">
    <div class="chips" id="chips" role="group" aria-label="Filtrer par couleur">
      <button class="chip" type="button" data-f="all" aria-pressed="true">Tous</button>
      <button class="chip" type="button" data-f="o" aria-pressed="false"><i style="background:var(--c-o)"></i>Communications</button>
      <button class="chip" type="button" data-f="g" aria-pressed="false"><i style="background:var(--c-g)"></i>Opérations</button>
      <button class="chip" type="button" data-f="b" aria-pressed="false"><i style="background:var(--c-b)"></i>Ressources</button>
      <button class="chip" type="button" data-f="r" aria-pressed="false"><i style="background:var(--c-r)"></i>Danger</button>
    </div>
  </div>

  <main>
    <ul id="list"></ul>
    <div class="empty" id="empty">Aucun code trouvé</div>
  </main>

  <footer><p>ssig.app</p></footer>
</div>

<script>
(function(){
  var D = [
   ["10-1","À l’écoute","o"],
   ["10-2","Répétez le message","o"],
   ["10-3","Affectation / Message annulé (préciser)","o"],
   ["10-4","Message reçu","o"],
   ["10-5","Disponible","g"],
   ["10-07","Intervention nécessaire","g"],
   ["10-08","Aggravation improbable, ressources suffisantes","g"],
   ["10-09","Aggravation probable, ressources suffisantes","g"],
   ["10-10","Maître de la situation","g"],
   ["10-11","Force de frappe atteinte","g"],
   ["10-12","Transmettez la 2<sup>e</sup> alerte","g"],
   ["10-13","Transmettez la 3<sup>e</sup> alerte","g"],
   ["10-14","Transmettez la 4<sup>e</sup> alerte","g"],
   ["10-15","Transmettez la 5<sup>e</sup> alerte","g"],
   ["10-16","En route pour l’appel","g"],
   ["10-17","Arrivé sur les lieux","g"],
   ["10-18","En reconnaissance","g"],
   ["10-19","Fausse alerte","g"],
   ["10-20","Donnez votre position","o"],
   ["10-21","Donnez l’emplacement de l’intervention","o"],
   ["10-22","Service non requis","o"],
   ["10-23","Communiquez par téléphone avec…","o"],
   ["10-24","Avez-vous capté le message?","o"],
   ["10-25","Avisez le directeur","o"],
   ["10-27","Arrivé auprès de la victime","g"],
   ["10-28","Responsable du bâtiment","b"],
   ["10-30","Agent des mesures préventives (TPI)","b"],
   ["10-31","Environnement Québec","b"],
   ["10-33","Travaux publics","b"],
   ["10-34","Service ambulancier","b"],
   ["10-35","Service de police *code 60","b"],
   ["10-36","Hydro-Québec","b"],
   ["10-37","Compagnie de gaz","b"],
   ["10-38","Entreprise de remorquage","b"],
   ["10-39","Demandons test radio","o"],
   ["10-40","Provenance de l’appel?","o"],
   ["10-41","Présence d’un élément dangereux","r"],
   ["10-42","Croix-Rouge","b"],
   ["10-43","Compagnie ferroviaire","b"],
   ["10-44","Présence de personnes à mobilité réduite","b"],
   ["10-45","MAPAQ","b"],
   ["10-46","SOPFEU","b"],
   ["10-47","Garde côtière","b"],
   ["10-49","Unité indisponible","g"],
   ["10-50","Libérez les ondes","b"],
   ["10-51","Syntonisez une autre fréquence d’opération","b"],
   ["10-53","Donnez les infos de l’appel","g"],
   ["10-54","Donnez les infos minimales de l’appel","g"],
   ["10-61","Permission de communiquer par radio-PATCH","o"],
   ["10-70","Sauvetage nécessaire","g"],
   ["10-75","Bâtiment à risques particuliers","b"],
   ["10-80","Bâtiment vacant","b"],
   ["10-90","Intervention terminée","g"],
   ["10-91","Mesures d’urgence (Avis aux partenaires)","g"],
   ["10-99","Manœuvres de réanimation en cours","b"],
   ["10-100","N’utilisez pas sirène ni clignotants (Mode B)","o"],
   ["10-101","N’utilisez aucun radio-émetteur, cellulaire, téléavertisseur, ordinateur véhiculaire dans le périmètre de sécurité","r"],
   ["Code 60","Demandons la police sur les lieux pour une personne suspecte ou récalcitrante (*10-35)","r"],
   ["Code rouge","Retrait prioritaire urgent (transmis par le SSI)","r"]
  ];
  var list=document.getElementById('list'), q=document.getElementById('q'),
      empty=document.getElementById('empty'), chips=document.getElementById('chips'), f='all';
  function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/<[^>]+>/g,'');}
  list.innerHTML=D.map(function(d){
    var c=d[0],t=d[1],k=d[2];
    return '<li class="'+k+'" data-k="'+k+'" data-s="'+norm(c+' '+c.replace(/-0/,'-')+' '+t)+'">'+
           '<div class="code'+(c.indexOf('Code')===0?' long':'')+'">'+c+'</div><div class="txt"><span>'+t+'</span></div></li>';
  }).join('');
  function apply(){
    var s=norm(q.value.trim()),n=0;
    Array.prototype.forEach.call(list.children,function(li){
      var ok=(f==='all'||li.dataset.k===f)&&(!s||li.dataset.s.indexOf(s)>-1);
      li.style.display=ok?'':'none'; if(ok)n++;
    });
    empty.style.display=n?'none':'block';
  }
  q.addEventListener('input',apply);
  chips.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b)return; f=b.dataset.f;
    Array.prototype.forEach.call(chips.children,function(c){c.setAttribute('aria-pressed',c===b);});
    apply();
  });
})();
</script>
</body>
</html>
