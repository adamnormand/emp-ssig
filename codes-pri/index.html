<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codes PRI — SSI Gaspé</title>
<meta name="description" content="Référence rapide des codes PRI (nature d'appel) — Service de sécurité incendie de la Ville de Gaspé.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1832">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1832; --shield:#1E3568; --red:#CE2338;
    --btn:#F4F5F7; --btn-ink:#0E1832; --muted:#8FA0C4; --line:rgba(255,255,255,.18);
    --peach:#E9B98A;
    --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:#fff;font-family:var(--body);line-height:1.35;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;
    padding:0 calc(18px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}

  .top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 10px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .back{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);text-decoration:none}
  .back:hover,.back:focus-visible{color:#fff}
  h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
  .maj{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .chevron{height:7px;margin:10px 0 12px;background:repeating-linear-gradient(115deg,var(--red) 0 12px,#fff 12px 24px)}
  .search{width:100%;min-height:46px;padding:10px 14px;font:500 17px var(--body);
    background:var(--shield);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:0;outline:none;
    -webkit-appearance:none;appearance:none}
  .search::placeholder{color:var(--muted)}
  .search:focus{border-color:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;
    background:transparent;color:#fff;border:1px solid var(--line);cursor:pointer;
    font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
  .chip i{width:9px;height:9px;display:inline-block}
  .chip[aria-pressed="true"]{background:#fff;color:var(--btn-ink);border-color:#fff}
  .chip:focus-visible{outline:3px solid #fff;outline-offset:2px}

  .section-label{display:flex;align-items:center;gap:10px;margin:16px 0 8px;
    font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .section-label::after{content:"";flex:1;height:1px;background:var(--line)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  li{display:flex;align-items:stretch;background:var(--btn);color:var(--btn-ink);min-height:50px;border-left:5px solid var(--peach)}
  .code{flex:none;width:70px;display:flex;align-items:center;padding-left:12px;
    font-family:var(--mono);font-weight:600;font-size:18px;color:#8A5A28;font-variant-numeric:tabular-nums}
  .txt{flex:1;padding:9px 12px 9px 0;display:flex;align-items:center;font-size:15px;line-height:1.3}
  .txt b{font-weight:700}
  li.r{border-color:var(--red);background:#FCE9EC} li.r .code{color:var(--red)}
  .empty{display:none;text-align:center;color:var(--muted);padding:28px 0;font-family:var(--display);
    letter-spacing:.16em;text-transform:uppercase;font-size:13px}

  footer{margin-top:18px;text-align:center}
  footer p{margin:0;font-family:var(--mono);font-size:11px;color:var(--muted);opacity:.65}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="bar">
      <h1>Codes PRI</h1>
      <a class="back" href="../">‹ Accueil</a>
    </div>
    <div class="maj">Nature de l’appel</div>
    <div class="chevron" aria-hidden="true"></div>
    <input class="search" id="q" type="search" inputmode="search" autocomplete="off"
           placeholder="Code ou mot-clé…" aria-label="Rechercher un code">
    <div class="chips" id="chips" role="group" aria-label="Filtrer">
      <button class="chip" type="button" data-f="all" aria-pressed="true">Tous</button>
      <button class="chip" type="button" data-f="r" aria-pressed="false"><i style="background:var(--red)"></i>Rouges seulement</button>
    </div>
  </div>

  <main id="main"></main>
  <div class="empty" id="empty">Aucun code trouvé</div>

  <footer><p>ssig.app</p></footer>
</div>

<script>
(function(){
  // [code, libellé (gras = <b>), "r" si ligne rouge sur la carte]
  var D = [
   ["100","<b>Système d’alarme</b>",""],
   ["101","Alarme <b>monoxyde</b> de carbone (CO) / Gaz",""],
   ["102","Vérification d’alarme",""],
   ["110","<b>Feu de bâtiment</b>","r"],
   ["111","Feu de <b>cheminée</b>","r"],
   ["112","Vérification intérieure","r"],
   ["120","<b>Feu extérieur</b>",""],
   ["121","Feu de <b>forêt / Tourbière</b>",""],
   ["122","Vérification extérieure",""],
   ["123","<b>Danger électrique</b> extérieur",""],
   ["130","<b>Feu de véhicule</b>","r"],
   ["131","Feu de véhicule avec <b>matière dangereuse</b>","r"],
   ["200","Sauvetage <b>nautique</b>",""],
   ["201","Sauvetage <b>terrestre</b>",""],
   ["202","Sauvetage en <b>hauteur / espace clos</b>",""],
   ["203","Sauvetage de <b>personne(s) coincée(s)</b>",""],
   ["204","Investigation / Autre(s) sauvetage(s)",""],
   ["300","<b>Accident de la route</b> (coincé)","r"],
   ["301","<b>Accident de la route</b> (inconnu si coincé)","r"],
   ["302","<b>Accident de la route</b>","r"],
   ["400","Aide à la population",""],
   ["401","Entraide",""],
   ["402","Assistance",""],
   ["500","Incendie / Incident d’<b>aéronef</b>","r"],
   ["501","Incendie / Incident <b>ferroviaire</b>","r"],
   ["502","Incendie / Incident maritime","r"],
   ["503","Incendie / Incident de <b>matière dangereuse</b>","r"]
  ];
  var main=document.getElementById('main'), q=document.getElementById('q'),
      empty=document.getElementById('empty'), chips=document.getElementById('chips'), f='all';
  function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/<[^>]+>/g,'');}
  var html='', serie=null;
  D.forEach(function(d){
    var s=d[0].charAt(0);
    if(s!==serie){
      if(serie!==null) html+='</ul></section>';
      serie=s; html+='<section><h2 class="section-label">Série '+s+'00</h2><ul>';
    }
    html+='<li class="'+(d[2]||'n')+'" data-k="'+(d[2]||'n')+'" data-s="'+norm(d[0]+' '+d[1])+'">'+
          '<div class="code">'+d[0]+'</div><div class="txt"><span>'+d[1]+'</span></div></li>';
  });
  main.innerHTML=html+'</ul></section>';
  function apply(){
    var s=norm(q.value.trim()), n=0;
    Array.prototype.forEach.call(main.querySelectorAll('section'),function(sec){
      var m=0;
      Array.prototype.forEach.call(sec.querySelectorAll('li'),function(li){
        var ok=(f==='all'||li.dataset.k===f)&&(!s||li.dataset.s.indexOf(s)>-1);
        li.style.display=ok?'':'none'; if(ok)m++;
      });
      sec.style.display=m?'':'none'; n+=m;
    });
    empty.style.display=n?'none':'block';
  }
  q.addEventListener('input',apply);
  chips.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b)return; f=b.dataset.f;
    Array.prototype.forEach.call(chips.children,function(c){c.setAttribute('aria-pressed',c===b);});
    apply();
  });
})();
</script>
</body>
</html>
